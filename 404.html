<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 - 我的站点</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
    <nav class="top-nav">

            <span class="site-brand">我的站点</span>

                <a href="help.html" class="btn btn-secondary">帮助中心</a>
            </div>
            <p class="error-hint">如果反复出现该提示，请刷新页面或稍后再试。</p>

</html>
