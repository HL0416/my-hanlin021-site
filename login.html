<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h2>用户登录</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>登录方式</label>
                <div class="login-mode-switch" id="loginModeSwitch">
                    <button type="button" class="mode-btn active" data-mode="password">密码登录</button>
                    <button type="button" class="mode-btn" data-mode="code">验证码登录</button>
                </div>
            </div>
            <div class="form-group">
                <label for="username">账号</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名、手机号或邮箱">
            </div>
            <div class="form-group" id="passwordGroup">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码">
            </div>
            <div class="form-group" id="codeGroup" style="display:none;">
                <label for="verifyCode">验证码</label>
                <div class="code-row">
                    <input type="text" id="verifyCode" inputmode="numeric" maxlength="6" placeholder="请输入6位验证码">
                    <button type="button" id="sendCodeBtn" class="btn btn-secondary btn-sm">获取验证码</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">登 录</button>
        </form>
        <p class="auth-link">还没有账号？<a href="register.html">立即注册</a></p>
        <p class="auth-link"><a href="forgot.html">忘记密码？</a></p>
        <div id="codeNotice" class="success-msg"></div>
        <div id="errorMsg" class="error-msg"></div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
