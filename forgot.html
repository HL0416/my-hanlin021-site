<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h2>找回密码</h2>
        <p class="forgot-desc">通过注册时的手机号或邮箱重置密码</p>
        <form id="forgotForm">
            <div class="form-group">
                <label for="forgotAccount">手机号 / 邮箱</label>
                <div class="code-input-row">
                    <input type="text" id="forgotAccount" name="account" required placeholder="请输入注册时填写的手机号或邮箱">
                    <button type="button" id="sendCodeBtn" class="btn btn-secondary code-btn">获取验证码</button>
                </div>
                <div id="forgotAccountTip" class="password-hint"></div>
            </div>
            <div class="form-group">
                <label for="forgotCode">验证码</label>
                <input type="text" id="forgotCode" name="code" required placeholder="请输入收到的验证码" maxlength="6">
            </div>
            <div class="form-group">
                <label for="forgotNewPassword">新密码</label>
                <input type="password" id="forgotNewPassword" required placeholder="请输入新密码（至少6位，含字母和数字）">
            </div>
            <div class="form-group">
                <label for="forgotConfirmPassword">确认新密码</label>
                <input type="password" id="forgotConfirmPassword" required placeholder="请再次输入新密码">
            </div>
            <button type="submit" class="btn btn-primary">重置密码</button>
        </form>
        <p class="auth-link">想起密码了？<a href="login.html">返回登录</a></p>
        <div id="errorMsg" class="error-msg"></div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
